{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Sistema - SEAMI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body style="margin: 0; padding: 0; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif;">
    <div style="width: 100%; max-width: 440px; margin: 24px; background-color: #ffffff; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);">
        
        <!-- Topo com Identidade SEAMI -->
        <div style="background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%); padding: 36px 32px 28px; text-align: center; color: #ffffff;">
            <div style="width: 64px; height: 64px; border-radius: 20px; background-color: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);">
                🧸
            </div>
            <h1 style="font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.5px;">
                Portal SEAMI
            </h1>
            <p style="font-size: 13.5px; opacity: 0.9; margin: 0; line-height: 1.4;">
                Acompanhamento e Gestão de Presença Infantil
            </p>
        </div>

        <!-- Formulário de Login Django -->
        <div style="padding: 32px;">
            {% if form.errors %}
                <div style="padding: 12px 16px; border-radius: 10px; background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; font-size: 13px; font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="alert-circle" style="width: 16px; height: 16px; color: #ef4444;"></i>
                    <span>Usuário ou senha incorretos. Verifique suas credenciais.</span>
                </div>
            {% endif %}

            <form method="post" action="{% url 'accounts:login' %}" style="display: flex; flex-direction: column; gap: 18px;">
                {% csrf_token %}
                <div>
                    <label for="id_username" style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">
                        Usuário ou E-mail
                    </label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <i data-lucide="user" style="position: absolute; left: 14px; color: #94a3b8; width: 18px; height: 18px;"></i>
                        <input type="text" name="username" autofocus required id="id_username" placeholder="ex: admin"
                               style="width: 100%; padding: 12px 14px 12px 42px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 14px; color: #0f172a; outline: none; box-sizing: border-box;">
                    </div>
                </div>

                <div>
                    <label for="id_password" style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">
                        Senha de Acesso
                    </label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <i data-lucide="lock" style="position: absolute; left: 14px; color: #94a3b8; width: 18px; height: 18px;"></i>
                        <input type="password" name="password" required id="id_password" placeholder="••••••••"
                               style="width: 100%; padding: 12px 42px 12px 42px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 14px; color: #0f172a; outline: none; box-sizing: border-box;">
                        <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 12px; background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px;">
                            <i data-lucide="eye" id="eye-icon" style="width: 18px; height: 18px;"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        style="margin-top: 8px; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%); color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(67, 56, 202, 0.35);">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function togglePasswordVisibility() {
            const passInput = document.getElementById('id_password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
